name: CI (build, test, scan)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Verify modules
      run: go mod verify

    - name: Vet and test
      run: |
        go vet ./...
        go test ./...

    - name: Build binary
      run: CGO_ENABLED=0 GOOS=linux go build -v -o healer ./cmd/healer

    - name: Vulnerability check
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    - name: Build image
      run: docker build -t k8s-self-healer:ci .

    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: k8s-self-healer:ci
        severity: CRITICAL,HIGH
        exit-code: '1'
        ignore-unfixed: true
